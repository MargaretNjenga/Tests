name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what's wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (if known)
      placeholder: |
        Environment: [staging/prod/dev]
        Build/commit:
    validations:
      required: false

  - type: textarea
    id: test_case
    attributes:
      label: Test Case Reference (QA only, optional)
      description: Link to the test case or test suite this came from, if applicable.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots/Logs
      description: Attach if available.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker — nothing works
        - High — major feature broken
        - Medium — workaround exists
        - Low — cosmetic/minor
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      options:
        - "Yes — worked before, broke recently"
        - "No — new issue"
        - Unknown
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: When it started, who's affected, related tickets.
    validations:
      required: false

  - type: dropdown
    id: team
    attributes:
      label: Owning Team
      description: Who should triage this first? (Can be reassigned later.)
      options:
        - Data
        - Product
        - Tech
        - QA
        - Not sure yet
    validations:
      required: true
