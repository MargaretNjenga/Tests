name: Enhancement / Feature Request
description: Use this template to request a new feature or enhancement that is not currently available in the application
title: "[Enhancement/Feature Request]: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit a new feature request! ✨

        Please provide detailed information below to help us understand and prioritize this enhancement effectively.

  - type: markdown
    attributes:
      value: |
        **Add a title**

        Give the enhancement request a clear, specific title — someone scanning the issue list should understand the request without opening it.

  - type: dropdown
    id: enhancement_product
    attributes:
      label: 🎯 Affected Product
      description: Select the product where you want this enhancement
      options:
        - PROMPTS
        - MENTORS
        - DELTA
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 🎯 Use Case / Problem Statement
      description: What need or gap does this address? Why now?
      value: |
        ### Problem
        [Describe the current problem or limitation]

        ### Use Case
        [Describe who needs this feature and how they would use it]

        ### Impact
        [Explain the impact of solving this problem]
    validations:
      required: true
 
  - type: textarea
    id: proposed_solution
    attributes:
      label: 🎯 Proposed Solution
      description: What are we building/changing?
      value: |
        ### Proposed Solution
        [Describe the proposed solution]

    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: Define what success looks like. What should be true when this feature is complete?
      value: |
        ### Functional Requirements
        - [ ] [Specific requirement 1]
        - [ ] [Specific requirement 2]
        - [ ] [Specific requirement 3]

        ### User Experience
        - [ ] [UX requirement 1]
        - [ ] [UX requirement 2]

        ### Success Metrics
        - [ ] [How to measure success]
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 🚫 Out of Scope
      description: What this ticket explicitly does NOT cover.
      placeholder: |
        - [Feature or behavior explicitly excluded from this request]
        - [Related work being tracked separately, if any]
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 🔺 Priority
      options:
        - "P0: Showstopper"
        - "P1: Critical"
        - "P2: High"
        - "P3: Medium"
        - "P4: Low"
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: 👥 Owning Team
      description: Who should pick this ticket up first? (Can be reassigned later.)
      options:
        - Data
        - Product
        - Tech
        - QA
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: extra_info
    attributes:
      label: 📋 Additional Information
      description: "Share any other relevant context such as: Mockups/Wireframes, Technical Considerations, Related Issues, Research/References etc"
      placeholder: |
        ### Mockups/Wireframes
        [Add any mockups, wireframes, or design references]

        ### Technical Considerations
        [Any technical constraints, dependencies, or implementation notes]

        ### Related Issues
        [Link to any related issues, discussions, or existing features]

        ### Research/References
        [Any research, examples from other products, or reference materials]
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        **📋 Important Reminders:**

        1. You are responsible for communicating updates about this feature request with the team
        2. Keep the issue updated as progress is made
        3. For questions, contact the project contact, Tech Team Managers, Head of Department, or Director

        **Thank you for helping us improve our products! 🎉**
