name: Bug Report
description: Use this template to report a bug experienced on any Jacaranda Health product
title: "[Bug Report]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! 🐛

        Please provide as much detail as possible to help us reproduce and fix the issue quickly.

  - type: markdown
    attributes:
      value: |
        **Add a title**

        Give the bug a clear, specific title — someone scanning the issue list should understand what's broken without opening it.

  - type: dropdown
    id: bug_product
    attributes:
      label: 🎯 Affected Product
      description: Select the product where you experienced the bug
      options:
        - PROMPTS
        - MENTORS
        - DELTA
        - Other
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: 📝 Description
      description: |
        Summarize the bug in 2–3 sentences: what's broken, where you noticed it, and how bad the impact is. Save exact reproduction steps for the field below.
      value: |
        ### What's broken
        [One sentence on what's not working]

        ### Where you noticed it
        [Page, feature, or flow]

        ### Impact
        [Who's affected and how badly]
    validations:
      required: true

  - type: textarea
    id: bug_replicate
    attributes:
      label: 🔄 Steps to Reproduce
      description: Provide clear, step-by-step instructions to reproduce the bug
      value: |
        1. Go to [specific page/feature]
        2. Click on [specific element]
        3. Enter [specific data]
        4. Observe the bug occurs
    validations:
      required: true

  - type: textarea
    id: bug_expected
    attributes:
      label: ✅ Expected Behavior
      description: Describe how the feature should work correctly
      value: |
        The feature should:
        - [Expected behavior 1]
        - [Expected behavior 2]
        - [Expected behavior 3]
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity
      options:
        - Blocker — nothing works
        - High — major feature broken
        - Medium — workaround exists
        - Low — cosmetic/minor
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: ⏮️ Regression?
      options:
        - "Yes — worked before, broke recently"
        - "No — new issue"
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: 👥 Owning Team
      description: Who should triage this first? (Can be reassigned later.)
      options:
        - Data
        - Product
        - Tech
        - QA
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: duplicate_check
    attributes:
      label: 🔍 Duplicate Check
      description: |
        Confirm you searched existing issues and didn't find a matching one. If a related ticket exists, link it.
      placeholder: |
        - [ ] I searched existing issues and didn't find a matching one
        - [ ] Related ticket (if any): #
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 💻 Environment
      description: "Staging / Dev / Prod"
      placeholder: "staging / dev / prod"
    validations:
      required: false

  - type: textarea
    id: bug_extra_info
    attributes:
      label: 📋 Additional Information
      description: |
        Share any other relevant context: Screenshots/Videos, Error Messages, Additional Context (when it started, who's affected, related tickets).
      placeholder: |
        ### Screenshots/Videos
        [Add screenshots or screen recordings showing the bug]

        ### Error Messages
        [Copy any error messages or console logs]

        ### Additional Context
        [When it started, who's affected, related tickets]
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        **📋 Important Reminders:**

        1. You are responsible for communicating updates about this bug report with the team
        2. Keep the issue updated as progress is made
        3. For questions, contact the Tech Team Managers, Head of Department, or Director

        **Thank you for helping us improve our products! 🎉**
