name: Task
description: Maintenance, chores, or general sprint work that isn't a bug, feature, or investigation
title: "[Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        -
        -
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must have (this sprint)
        - Should have
        - Nice to have
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: Owning Team
      options:
        - Data
        - Product
        - Tech
        - QA
        - Not sure yet
    validations:
      required: true
